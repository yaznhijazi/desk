<!DOCTYPE html>
<html lang="en" data-mode="in">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yazan's Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed 3D desk nook; status tag top-left, notice card bottom-left,
     remote = the whole page on a phone, a right drawer on the office screen.
     One world, single theme by choice: a dim room lit by warm lamps. */
  --night:#1a1210; --line:#4a342c; --paper:#f6ecdd; --ink:#2a1a14; --muted:#c2ad9d;
  --ember:#ff7a3c; --in:#8fc46c; --busy:#ff5266; --out:#ffb347;
  --state:var(--in);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
:root[data-mode=focus]{--state:var(--busy)}
:root[data-mode=away]{--state:var(--out)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--paper);font:400 16px/1.45 var(--display);overflow:hidden}
.remote body{overflow:auto}
p,h1,h2{margin:0}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.eyebrow,legend{font:600 .8rem/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* office screen overlay */
.tag{position:fixed;top:clamp(16px,3vh,40px);left:clamp(16px,3vw,48px);display:flex;gap:14px;align-items:center;padding:8px 8px 8px 18px;border-radius:99px;background:var(--night)}
.pill{padding:.45em .95em .45em .75em;border-radius:99px;background:var(--paper);color:var(--ink);font-weight:600;display:flex;align-items:center;gap:.5em}
.pill::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--state)}
.notice{position:fixed;left:clamp(16px,3vw,48px);bottom:clamp(16px,4vh,48px);max-width:min(46ch,62vw);padding:clamp(18px,2.4vw,36px);
  background:var(--paper);color:var(--ink);border-radius:20px;border-left:10px solid var(--state);display:none;flex-direction:column;gap:.7rem}
:root:not([data-mode=in]) .notice{display:flex}
.notice .eyebrow{color:#7a6457}
.notice h1{font:800 clamp(2.2rem,5.5vw,5.5rem)/1 var(--display);text-wrap:balance;overflow-wrap:anywhere}
.notice #n-meta{font:600 clamp(1rem,1.6vw,1.6rem)/1.3 var(--mono)}
.tools{position:fixed;right:clamp(16px,3vw,48px);bottom:clamp(16px,4vh,48px);display:flex;gap:10px;transition:opacity .4s}
.tools.idle{opacity:0}
.tools:focus-within{opacity:1}

/* controls */
button{font:600 1rem var(--display);border:0;border-radius:12px;padding:.7em 1.1em;cursor:pointer;background:var(--paper);color:var(--ink)}
:is(button,input,select,summary):focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);padding:28px 22px;background:var(--night);border-left:1px solid var(--line);
  overflow:auto;display:none;flex-direction:column;gap:18px}
.panel.open{display:flex}
.remote .panel{position:static;display:flex;width:auto;max-width:520px;min-height:100%;margin:0 auto;border:0}
.remote :is(#scene,.tag,.notice,.tools,#b-close,#pair){display:none}
.panel h2{font:800 2rem/1.05 var(--display);text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);font:400 .85rem var(--mono)}
#controls,fieldset,.field,details>div{display:flex;flex-direction:column;gap:10px;min-width:0}
#controls{gap:22px}
fieldset{border:0;padding:0;margin:0}
legend{padding:0;margin-bottom:10px}
.big,.chips button{background:#2e201b;color:var(--paper);border:1px solid var(--line)}
.big{font-size:1.15rem;padding:1em}
.big[aria-pressed="true"]{background:var(--in);color:#12260a;border-color:var(--in)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button[aria-pressed="true"]{background:var(--state);color:#2b1700;border-color:var(--state)}
label{font-size:.9rem;color:var(--muted)}
input,select{font:400 1rem var(--display);padding:.7em .8em;border-radius:12px;border:1px solid var(--line);background:#120c0a;color:var(--paper);width:100%;min-width:0}
input[type=color]{padding:4px;height:46px;flex:0 0 64px}
.row{display:flex;gap:8px;align-items:center}
.row button{flex:none}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600}
details>div{margin-top:12px}
.note{min-height:1.3em;color:var(--out);font:400 .85rem var(--mono)}
#b-close{align-self:flex-end;background:none;color:var(--muted);padding:.2em .4em}
.unlinked-msg{display:none}
.unlinked #controls{display:none}
.unlinked .unlinked-msg{display:block}
@media (prefers-reduced-motion:reduce){.tools{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<header class="tag">
  <p class="eyebrow"><span data-name>Yazan</span>'s desk</p>
  <p class="pill" id="pill">In the office</p>
</header>

<section class="notice" aria-live="polite">
  <p class="eyebrow" id="n-eyebrow"></p>
  <h1 id="n-where"></h1>
  <p id="n-meta"></p>
</section>

<nav class="tools">
  <button id="fs">Full screen</button>
  <button id="gear">Change status</button>
</nav>

<main class="panel" id="panel">
  <button id="b-close">Close</button>
  <p class="eyebrow">Desk remote</p>
  <h2 id="p-title">You're at your desk</h2>
  <p class="sub" id="p-sub">The office screen shows this status.</p>
  <p class="unlinked-msg">This phone is not linked yet. On the office screen choose Change status, copy the phone link, send it to yourself and open it here.</p>

  <div id="controls">
    <button class="big" id="b-in" aria-pressed="true">I'm at my desk</button>

    <div class="field">
      <label for="back">Back or free around (optional, set it before you tap)</label>
      <input type="time" id="back">
    </div>

    <fieldset>
      <legend>At my desk, do not disturb</legend>
      <div class="chips" id="chips-focus"></div>
    </fieldset>

    <fieldset>
      <legend>I'm stepping out</legend>
      <div class="chips" id="chips-away"></div>
      <label for="where">Somewhere else</label>
      <div class="row"><input id="where" maxlength="60" placeholder="Client visit, 3rd floor"><button id="b-go">Show</button></div>
    </fieldset>

    <details>
      <summary>Desk favorites</summary>
      <div>
        <label for="f-name">Name on the screen</label>
        <input id="f-name" maxlength="24">
        <label for="f-team">Favorite team (goes on the framed poster)</label>
        <input id="f-team" maxlength="24" placeholder="Team name">
        <label for="f-c1">Team colors</label>
        <div class="row"><input type="color" id="f-c1"><input type="color" id="f-c2" aria-label="Second team color"></div>
        <label for="f-drink">Favorite drink (sits by the keyboard)</label>
        <select id="f-drink"><option value="coffee">Coffee</option><option value="tea">Tea</option><option value="cola">Cola</option><option value="water">Water</option></select>
        <button id="b-fav">Save favorites</button>
      </div>
    </details>

    <div class="field" id="pair">
      <label for="link">Link for your phone (keep it private: it controls this screen)</label>
      <div class="row"><input id="link" readonly><button id="b-copy">Copy</button></div>
    </div>
  </div>
  <p class="note" id="note" role="status"></p>
</main>

<script type="module">
const THREE_URL = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';
const RELAY = 'https://ntfy.sh';   // free public relay; it only ever sees encrypted text. Point this at your own ntfy server if you host one.
const FOCUS = ['In a call', 'Focusing'];
const PLACES = ['Meeting', 'Lunch', 'Break', 'Working from home', 'Out for the day'];
const DRINKS = ['coffee', 'tea', 'cola', 'water'], MODES = ['in', 'focus', 'away'];
const DEF = { mode: 'in', where: '', back: '', at: 0, name: 'Yazan', team: '', c1: '#d62839', c2: '#ffffff', drink: 'coffee' };
const HEX = /^#[0-9a-f]{6}$/i;
const $ = s => document.querySelector(s);
const root = document.documentElement;

// The status arrives over the network, so treat it as untrusted: coerce every field.
const clean = d => ({
  mode: MODES.includes(d.mode) ? d.mode : 'in',
  where: String(d.where ?? '').slice(0, 60),
  back: /^\d\d:\d\d$/.test(d.back) ? d.back : '',
  at: +d.at || 0,
  name: String(d.name || DEF.name).slice(0, 24),
  team: String(d.team ?? '').slice(0, 24),
  c1: HEX.test(d.c1) ? d.c1 : DEF.c1,
  c2: HEX.test(d.c2) ? d.c2 : DEF.c2,
  drink: DRINKS.includes(d.drink) ? d.drink : DEF.drink,
});
const hhmm = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
// "Back in 25 min", "Free around 3:00 PM", "Back any minute", or '' when there is nothing to say.
function backInfo(s, now = Date.now()) {
  if (!s.back || s.mode === 'in') return '';
  const [h, m] = s.back.split(':').map(Number), t = new Date(s.at || now);
  t.setHours(h, m, 0, 0);
  if (t < (s.at || now)) t.setDate(t.getDate() + 1);   // a time earlier than when it was set means tomorrow
  const mins = Math.round((t - now) / 60000), word = s.mode === 'focus' ? 'Free' : 'Back';
  return mins > 90 ? `${word} around ${hhmm(t)}` : mins > 0 ? `${word} in ${mins} min` : mins > -180 ? `${word} any minute` : '';
}
{ // self-check
  const c = clean({ mode: 'gone', where: 'x'.repeat(99), back: 'soon', c1: 'red', drink: 'beer', name: '' });
  console.assert(c.mode === 'in' && c.where.length === 60 && c.back === '' && c.c1 === DEF.c1 && c.drink === 'coffee' && c.name === 'Yazan', 'clean() broke');
  const at = new Date(2026, 0, 5, 10, 0).getTime(), s = clean({ mode: 'away', back: '10:25', at });
  console.assert(backInfo(s, at) === 'Back in 25 min' && backInfo(s, at + 40 * 60000) === 'Back any minute' && backInfo({ ...s, mode: 'focus' }, at) === 'Free in 25 min'
    && backInfo({ ...s, back: '09:00' }, at).startsWith('Back around') && backInfo({ ...s, mode: 'in' }, at) === '', 'backInfo() broke');
}

let state = clean(DEF), confirmed = state;   // confirmed = last status the relay accepted or sent
let sceneApply = null;                       // set once the 3D office is built
const remote = matchMedia('(max-width: 760px)').matches;
root.classList.toggle('remote', remote);
const note = msg => { $('#note').textContent = msg; };

function apply() {
  const s = state, at = new Date(s.at), busy = s.mode === 'focus';
  const when = !s.at ? '' : at.toDateString() === new Date().toDateString() ? hhmm(at)
    : at.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  root.dataset.mode = s.mode;
  document.querySelectorAll('[data-name]').forEach(e => { e.textContent = s.name; });
  $('#pill').textContent = { in: 'In the office', focus: 'Do not disturb', away: 'Away' }[s.mode];
  $('#n-eyebrow').textContent = busy ? `${s.name} is at the desk, but busy` : `${s.name} is not at the desk right now`;
  $('#n-where').textContent = s.where || (busy ? 'Busy' : 'Away from the desk');
  $('#n-meta').textContent = [backInfo(s), when && 'Updated ' + when].filter(Boolean).join(' · ');
  $('#p-title').textContent = s.mode === 'in' ? "You're at your desk" : (busy ? 'Do not disturb' : "You're away") + (s.where ? ': ' + s.where : '');
  $('#p-sub').textContent = when ? 'Office screen updated ' + when : 'The office screen shows this status.';
  $('#b-in').setAttribute('aria-pressed', s.mode === 'in');
  for (const b of document.querySelectorAll('.chips button')) b.setAttribute('aria-pressed', b.dataset.mode === s.mode && b.textContent === s.where);
  const fill = (id, v) => { const e = $(id); if (document.activeElement !== e) e.value = v; };
  fill('#back', s.back);
  fill('#where', s.mode !== 'away' || PLACES.includes(s.where) ? '' : s.where);
  fill('#f-name', s.name); fill('#f-team', s.team); fill('#f-c1', s.c1); fill('#f-c2', s.c2); fill('#f-drink', s.drink);
  sceneApply?.();
}

// ---- sync: both devices share one secret (in the link). The status is encrypted with it and passed through the relay. ----
const LS = 'desk-status', b64 = bytes => btoa(String.fromCharCode(...bytes)), utf8 = new TextEncoder();
let secret = location.hash.startsWith('#k=') ? location.hash.slice(3) : '';
try { if (secret) localStorage.setItem('desk-key', secret); else secret = localStorage.getItem('desk-key') || ''; } catch {}
if (!secret && !remote) {   // first run on the office screen: make the secret; the phone gets it through the link
  secret = b64(crypto.getRandomValues(new Uint8Array(16))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  try { localStorage.setItem('desk-key', secret); } catch {}
}
if (secret && !location.hash) history.replaceState(null, '', '#k=' + secret);   // so a bookmark keeps working
let topic = '', aes = null;
const linked = (async () => {
  const sha = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', utf8.encode(s)));
  topic = 'desk-' + [...(await sha('topic:' + secret)).slice(0, 12)].map(b => b.toString(16).padStart(2, '0')).join('');
  aes = await crypto.subtle.importKey('raw', await sha('key:' + secret), 'AES-GCM', false, ['encrypt', 'decrypt']);
})();
linked.catch(() => {});
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aes, utf8.encode(JSON.stringify(obj))));
  return b64([...iv, ...ct]);
}
async function unseal(text) {
  const u = Uint8Array.from(atob(text), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, aes, u.slice(12))));
}
const remember = () => { confirmed = state; try { localStorage.setItem(LS, JSON.stringify(state)); } catch {} };
async function save(patch) {
  state = clean({ ...state, ...patch, at: Date.now() });
  apply();
  try {
    await linked;
    const r = await fetch(`${RELAY}/${topic}`, { method: 'POST', body: await seal(state) });
    if (!r.ok) throw new Error(r.status);
    remember(); note('');
  } catch { state = confirmed; apply(); note("Could not send the update. Check this device's internet and try again."); }
}
async function connect() {
  try { const d = JSON.parse(localStorage.getItem(LS)); if (d) { state = confirmed = clean(d); apply(); } } catch {}
  if (!secret) return root.classList.add('unlinked');
  try { await linked; } catch { return note('This page needs https (or localhost) to encrypt the status.'); }
  const es = new EventSource(`${RELAY}/${topic}/sse?since=latest`);   // reconnects by itself and replays the latest status
  es.onopen = () => note('');
  es.onerror = () => note('Offline. Reconnecting.');
  es.onmessage = async e => {
    try {   // anything that does not decrypt with our secret is ignored
      const d = clean(await unseal(JSON.parse(e.data).message));
      if (d.at >= confirmed.at) { state = d; remember(); apply(); }
    } catch {}
  };
}

// ---- remote controls ----
const chip = (box, mode, label) => {
  const b = document.createElement('button');
  b.textContent = label; b.dataset.mode = mode;
  b.onclick = () => save({ mode, where: label, back: $('#back').value });
  $(box).append(b);
};
FOCUS.forEach(l => chip('#chips-focus', 'focus', l));
PLACES.forEach(l => chip('#chips-away', 'away', l));
$('#b-in').onclick = () => save({ mode: 'in', where: '', back: '' });
$('#b-go').onclick = () => save({ mode: 'away', where: $('#where').value.trim(), back: $('#back').value });
$('#where').onkeydown = e => { if (e.key === 'Enter') $('#b-go').click(); };
$('#b-fav').onclick = () => save({ name: $('#f-name').value.trim(), team: $('#f-team').value.trim(), c1: $('#f-c1').value, c2: $('#f-c2').value, drink: $('#f-drink').value });
$('#gear').onclick = $('#b-close').onclick = () => $('#panel').classList.toggle('open');
$('#fs').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen()).catch(() => {});
$('#link').value = location.origin + location.pathname + '#k=' + secret;
$('#b-copy').onclick = () => navigator.clipboard.writeText($('#link').value).then(() => note('Copied. Send it to your phone and open it there.'), () => { $('#link').select(); note('Select the link and copy it by hand.'); });
let idle;
const wake = () => { $('.tools').classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => $('.tools').classList.add('idle'), 4000); };
addEventListener('pointermove', wake); wake();

apply();
connect();
setInterval(apply, 30000);   // keeps "Back in 25 min" counting down
if (!remote) initScene().catch(e => console.error('3D office failed to load; the status overlay still works.', e));

// ---- the 3D office: a dim desk nook lit by a glow behind the monitor, a desk lamp and a mushroom lamp ----
async function initScene() {
  const T = await import(THREE_URL);
  const R = new T.WebGLRenderer({ canvas: $('#scene'), antialias: true });
  R.setPixelRatio(Math.min(devicePixelRatio, 2));
  R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
  R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.2;
  const scene = new T.Scene(); scene.background = new T.Color('#1a1210');
  const cam = new T.PerspectiveCamera(38, 1, .1, 40);
  const clockNow = () => new Date(Date.now() + (window.deskHourShift || 0) * 36e5);   // set deskHourShift in the console to preview another time of day

  // ---- builders ----
  const mats = {};
  const mat = (c, smooth = false) => mats[c + smooth] ||= new T.MeshStandardMaterial({ color: c, roughness: .85, flatShading: !smooth });
  const add = (geo, m, x, y, z, parent = scene) => {
    const o = new T.Mesh(geo, typeof m === 'string' ? mat(m) : m);
    o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o;
  };
  const box = (w, h, d, c, x, y, z, p) => add(new T.BoxGeometry(w, h, d), c, x, y, z, p);
  const cyl = (r, h, c, x, y, z, p, rTop = r) => add(new T.CylinderGeometry(rTop, r, h, 20), c, x, y, z, p);
  const gem = (r, c, x, y, z, p, detail = 0) => add(new T.IcosahedronGeometry(r, detail), c, x, y, z, p);   // faceted blob: leaves, pots, toys
  const soft = (geo, c, x, y, z, p) => add(geo, mat(c, true), x, y, z, p);                                  // smooth, for the person and the chair
  // a flat surface drawn with 2D canvas. lit = paper that reacts to the room light; otherwise it glows like a screen
  const screen = (w, h, pw, ph, x, y, z, p, { lit = false, transparent = false } = {}) => {
    const c = Object.assign(document.createElement('canvas'), { width: pw, height: ph });
    const tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace; tex.anisotropy = R.capabilities.getMaxAnisotropy();
    const m = add(new T.PlaneGeometry(w, h), lit ? new T.MeshStandardMaterial({ map: tex, roughness: .9, transparent })
      : new T.MeshBasicMaterial({ map: tex, transparent, toneMapped: false }), x, y, z, p);
    m.castShadow = false; m.receiveShadow = lit;
    return { g: c.getContext('2d'), tex, W: pw, H: ph };
  };
  const glowTex = (() => {
    const c = Object.assign(document.createElement('canvas'), { width: 128, height: 128 }), g = c.getContext('2d');
    const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(.35, 'rgba(255,255,255,.5)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    return new T.CanvasTexture(c);
  })();
  const glow = (w, h, color, x, y, z) => {   // soft additive halo
    const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ map: glowTex, color, transparent: true, blending: T.AdditiveBlending, depthWrite: false }));
    m.position.set(x, y, z); scene.add(m); return m;
  };
  const leaf = (x, y, z, r, i, p) => { const l = gem(r, i % 2 ? '#3f8a4c' : '#2f6b3f', x, y, z, p); l.scale.set(1, .5, .8); l.rotation.set(i * 1.9, i * 2.7, i * .8); return l; };
  const bush = (x, y, z, n, spread, r) => { for (let i = 0; i < n; i++) leaf(x + Math.cos(i * 2.4) * spread, y + (i % 3) * r * .5, z + Math.sin(i * 2.4) * spread * .6, r, i); };
  const vine = (x, y, z, n, drift = 0) => { for (let i = 0; i < n; i++) leaf(x + Math.sin(i * 1.7 + x * 9) * .03 + drift * i, y - i * .075, z + Math.cos(i * 2.3) * .015, .05 - i * .002, i); };

  const WALL = '#e8dfd3', WOOD = '#5a3524', DARK = '#161412', CREAM = '#efe3cf';

  // ---- lights ----
  const hemi = new T.HemisphereLight('#ffe6d0', '#2a1a14', .2); scene.add(hemi);
  const sun = new T.DirectionalLight('#e6eeff', 0); sun.position.set(-4, 4.5, 4); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0005;
  Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 16 });
  sun.shadow.camera.updateProjectionMatrix(); scene.add(sun);
  const back = new T.PointLight('#ff5a1f', 5, 6, 2); back.position.set(0, 1.4, -.86); scene.add(back);          // glow behind the monitor
  const wash = glow(4.4, 3.4, '#ff5a1f', 0, 1.45, -.985);
  const face = new T.PointLight('#cfd9ff', .5, 2, 2); face.position.set(0, 1.25, -.5); scene.add(face);           // light from the screen
  const lamp = new T.SpotLight('#ffcf9a', 14, 4, .75, .6, 2); lamp.position.set(.68, 1.44, -.72); lamp.target.position.set(.55, .76, -.42);
  lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -.001; scene.add(lamp, lamp.target);
  const fill = new T.PointLight('#ffb38a', 3, 7, 2); fill.position.set(1.6, 2.3, 2.2); scene.add(fill);                  // soft light from the room side, so the chair and I are not pure silhouettes

  function daylight(d) {   // the window follows the real time of day; the room stays dim so the lamps carry the mood
    const h = d.getHours() + d.getMinutes() / 60, k = Math.min(1, Math.max(0, (6.5 - Math.abs(h - 12.5)) / 1.5));
    sky.material.color.copy(NIGHT).lerp(DAY, k).lerp(DUSK, 3 * k * (1 - k)).multiplyScalar(.75);
    hemi.intensity = .1 + .16 * k; sun.intensity = .3 * k;
  }

  const MOOD = { in: ['#ff5a1f', 1], focus: ['#ff1f4b', 1], away: ['#ff5a1f', .15] };   // the colour of the room says the status from across the office
  let glowLevel = 1;
  sceneApply = () => {
    const now = clockNow(), here = state.mode !== 'away', [colour, level] = MOOD[state.mode];
    me.visible = here; glowLevel = level;
    back.color.set(colour); back.intensity = 5 * level; wash.material.color.set(colour);
    lamp.intensity = here ? 14 : 0; bulb.material.color.set(here ? '#ffd9a0' : '#3a3029'); face.intensity = here ? .5 : .2;
    chair.rotation.y = here ? 0 : .8; chair.position.z = here ? .1 : .45;
    if (drinkKind !== state.drink) setDrink(drinkKind = state.drink);
    drawSign(now); drawPoster(); drawCal(now); daylight(now); drawClock(now);
    if (!here) drawLock(now);
  };
  sceneApply();
  Promise.all([document.fonts.load(`600 20px ${MONO}`), document.fonts.load(`800 80px ${DISPLAY}`)]).then(sceneApply, () => {});

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let zoom = 1;
  const resize = () => { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; zoom = Math.max(1, 1.7 / cam.aspect); cam.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();

  const timer = new T.Clock(); let frame = 0, tick = 0, sec = -1;
  R.setAnimationLoop(() => {
    const t = timer.getElapsedTime();
    if (t - frame < 1 / 31) return;   // 30 fps is plenty for a screen that stays on all day
    frame = t;
    const now = clockNow(), here = state.mode !== 'away';
    if (now.getSeconds() !== sec) { sec = now.getSeconds(); drawClock(now); if (!here) drawLock(now); if (!sec) { drawSign(now); drawCal(now); daylight(now); } }
    if (t - tick > .09) { tick = t; drawFlow(t); if (here) typeCode(); }

    // a 30 s loop: type, glance over the shoulder (not while focusing), type, take a sip
    const cyc = t % 30, pulse = (a, b) => cyc > a && cyc < b ? Math.sin(Math.PI * (cyc - a) / (b - a)) ** 2 : 0;
    const turn = state.mode === 'in' ? pulse(8, 12) : 0, sip = here ? pulse(21, 26) : 0;
    head.rotation.set(Math.sin(t * .7) * .03 - .12 * sip, -1.15 * turn, 0);
    arms.forEach((a, i) => {
      const lift = i ? 0 : sip, typing = turn || lift ? 0 : Math.sin(t * 13 + i * 2.1) * .05;
      a.up.rotation.x = .3 + .2 * lift; a.fore.rotation.x = 1.2 + 1.3 * lift + typing;
    });
    arms[0].hand.getWorldPosition(hold); drink.position.lerpVectors(REST, hold.add(GRIP), sip);
    drink.userData.steam.forEach((p, i) => { const q = (t * .4 + i / 3) % 1; p.position.set(Math.sin(q * 6 + i) * .02, .14 + q * .22, 0); p.material.opacity = (1 - q) * .5 * (1 - sip); p.scale.setScalar(1 + q); });
    wash.material.opacity = glowLevel * (.82 + Math.sin(t * .8) * .08);   // the glow breathes a little
    signGlow.material.opacity = .22;

    const a = .24 + (still ? 0 : Math.sin(t * .06) * .06);
    cam.position.set(-.15 + Math.sin(a) * 4.6 * zoom, 2.3, -.9 + Math.cos(a) * 4.6 * zoom); cam.lookAt(-.15, 1.6, -.9);
    R.render(scene, cam);
  });
}
</script>
</body>
</html>
